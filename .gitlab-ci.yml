# ==============================================================================
# .gitlab-ci.yml — Esteira CI/CD PROD para Google Play Store (Modos de Som)
# ==============================================================================
# Variáveis necessárias em Settings > CI/CD > Variables (Protected + Masked):
#   - KEYSTORE_BASE64                 (Conteúdo do manage-sound-release.jks em Base64)
#   - RELEASE_STORE_PASSWORD          (Senha da keystore)
#   - RELEASE_KEY_ALIAS               (Alias da chave: managesoundmode)
#   - RELEASE_KEY_PASSWORD            (Senha da chave)
#   - PLAY_STORE_SERVICE_ACCOUNT_JSON (JSON da Service Account do Google Play Console)
# ==============================================================================

image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_SDK_TOOLS: "11076708"
  ANDROID_HOME: "${CI_PROJECT_DIR}/.android-sdk"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"

cache:
  key: "gradle-and-sdk-${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .android-sdk

stages:
  - quality
  - build
  - deploy_closed_testing
  - deploy_production

.setup_android_sdk: &setup_android_sdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip python3 python3-pip
    - |
      if [ ! -d "${ANDROID_HOME}/cmdline-tools/latest" ]; then
        mkdir -p "${ANDROID_HOME}/cmdline-tools"
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip" -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
        mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
      fi
    - export PATH="${PATH}:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools"
    - yes | sdkmanager --licenses > /dev/null || true
    - sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
    - chmod +x ./gradlew ./scripts/*.sh

# ------------------------------------------------------------------------------
# 1. QUALITY GATE: Testes Unitários + Android Lint (Roda em todo Push / MR)
# ------------------------------------------------------------------------------
quality_gate:
  stage: quality
  <<: *setup_android_sdk
  script:
    - ./gradlew testDebugUnitTest lintRelease --no-daemon
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: app/build/test-results/testDebugUnitTest/TEST-*.xml
    paths:
      - app/build/reports/tests/testDebugUnitTest/
      - app/build/reports/lint-results-release.html

# ------------------------------------------------------------------------------
# 2. BUILD & SIGN GATE: Gera AAB + APK Assinados + Símbolos R8 e Nativos
# ------------------------------------------------------------------------------
build_release_bundle:
  stage: build
  <<: *setup_android_sdk
  script:
    - |
      if [ -n "${KEYSTORE_BASE64:-}" ]; then
        mkdir -p app/keystore
        echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/manage-sound-release.jks
      fi
    - ./gradlew bundleRelease assembleRelease --no-daemon
    - rm -f app/keystore/manage-sound-release.jks
  artifacts:
    name: "modos-de-som-${CI_COMMIT_SHORT_SHA}"
    access: "developer"
    expire_in: 1 hour
    paths:
      - app/build/outputs/bundle/release/app-release.aab
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/mapping/release/mapping.txt

# ------------------------------------------------------------------------------
# 3. DEPLOY AUTOMÁTICO — TESTE FECHADO (Beta / Alpha na Play Store)
# ------------------------------------------------------------------------------
deploy_closed_testing:
  stage: deploy_closed_testing
  image: python:3.12-slim
  needs: ["build_release_bundle"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - pip install --quiet google-api-python-client google-auth-httplib2
  script:
    - python3 ./scripts/publish-play-store.py --track alpha

# ------------------------------------------------------------------------------
# 4. DEPLOY EM PRODUÇÃO (Apenas em Tags v*.*.* com aprovação manual)
# ------------------------------------------------------------------------------
deploy_production:
  stage: deploy_production
  image: python:3.12-slim
  needs: ["build_release_bundle"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  before_script:
    - pip install --quiet google-api-python-client google-auth-httplib2
  script:
    - python3 ./scripts/publish-play-store.py --track production
