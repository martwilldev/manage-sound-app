name: Android CI/CD — Google Play Store

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: "Faixa do Google Play (alpha = Teste Fechado, internal, beta, production)"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production

# Princípio do menor privilégio para repositório público (bloqueia escrita indevida via GITHUB_TOKEN)
permissions:
  contents: read

# Evita execuções concorrentes na mesma branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: "1. Quality Gate (Unit Tests + Lint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Run Unit Tests & Android Lint
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintRelease --no-daemon

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          retention-days: 5
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.html

  release-and-deploy:
    name: "2. Build, Sign & Google Play Gate (API 36)"
    needs: quality-gate
    # Roda apenas no repositório oficial e nunca em Pull Requests externos
    if: >-
      github.repository == 'martwilldev/manage-sound-app' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Signed Release Bundle & Validate / Publish to Google Play
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          INPUT_TRACK: ${{ github.event.inputs.track }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/manage-sound-release.jks
          fi
          trap 'rm -rf app/keystore app/build/outputs/bundle app/build/outputs/apk app/build/outputs/mapping' EXIT

          export APP_VERSION_CODE=$((4 + GITHUB_RUN_NUMBER))
          echo "Building Release with APP_VERSION_CODE=${APP_VERSION_CODE}"
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon
          rm -f app/keystore/manage-sound-release.jks

          pip install --quiet google-api-python-client google-auth-httplib2
          TRACK="${INPUT_TRACK:-alpha}"
          if [[ "$REF_NAME" == refs/tags/v* ]] && [[ -z "$INPUT_TRACK" ]]; then
            TRACK="alpha"
          fi

          # Publica na loja em tags v*.*.*, disparo manual (workflow_dispatch) ou commit contendo [deploy]
          if [[ -n "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]] && [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_NAME" == refs/tags/v* || "$COMMIT_MSG" == *"[deploy]"* ]]; then
            python3 ./scripts/publish-play-store.py --track "$TRACK"
          else
            PLAY_STORE_SERVICE_ACCOUNT_JSON="" python3 ./scripts/publish-play-store.py --track "$TRACK" --dry-run
          fi
